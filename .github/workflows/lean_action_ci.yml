name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read # Read access to repository contents
  pages: write # Write access to GitHub Pages
  id-token: write # Write access to ID tokens

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Free disk space for Lean documentation
        if: ${{ github.event_name == 'push' && github.event.repository.has_pages }}
        run: |
          df -h .
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h .
      - uses: leanprover/lean-action@v1
      - uses: leanprover-community/docgen-action@v1
        if: ${{ github.event_name == 'push' && github.event.repository.has_pages }}
